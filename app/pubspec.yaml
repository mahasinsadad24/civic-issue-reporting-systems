name: civic_issue_reporter
description: A Flutter mobile app for reporting civic issues
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  camera: ^0.11.0+2
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_fonts: ^7.0.0
  flutter_sound: ^9.8.3
  video_player: ^2.9.1
  file_picker: ^10.3.8
  shared_preferences: ^2.3.2
  intl: any
  provider: ^6.0.5
  path: ^1.9.0
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  flutter_dotenv: ^6.0.0
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  http: ^1.6.0



dependency_overrides:
  package_info_plus: 8.0.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - .env
